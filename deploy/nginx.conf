# /etc/nginx/sites-available/odr
#
# Reverse proxy para o lobby HTTP. UDP dos game_servers vai DIRETO para
# os jogadores, não passa pelo nginx. Por isso o nginx só cuida do
# matchmaker.

server {
    listen 80;
    listen [::]:80;
    server_name despertarraizes.com.br;

    # Rate limit conservador: 30 req/s por IP no endpoint /api/.
    # Suficiente para o cliente normal; trava scripts maliciosos.
    limit_req_zone $binary_remote_addr zone=odr_api:10m rate=30r/s;

    location /api/ {
        limit_req zone=odr_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    # Health check público — útil para uptime monitors externos
    location = /health {
        proxy_pass http://127.0.0.1:8080/api/health;
    }

    location / {
        return 200 "O Despertar das Raizes — game server\n";
        add_header Content-Type text/plain;
    }
}
